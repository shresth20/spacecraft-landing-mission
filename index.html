<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#03050c" />
  <!-- inline, so the browser's automatic /favicon.ico request never
       404s: nothing on the server has to exist for it -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%2306101f'/%3E%3Cpath d='M32 10 54 50H10Z' fill='%234fd8ff'/%3E%3C/svg%3E" />
  <title>Spacecraft Landing Mission/</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/animation.css" />
  <!-- the survey's two sites and screens 4-8: the shape task, the
       area task and the islands they are played on -->
  <link rel="stylesheet" href="css/rounds.css" />
  <!-- the landing and its two failures, for the survey and screens
       4 to 8.
       After style.css and rounds.css, and it has to stay there:
       the phase rules take the craft back off the idle bob and the
       arrival flight, and they do it on equal specificity, so being
       later in the cascade is the whole mechanism. -->
  <link rel="stylesheet" href="css/failure.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <!-- the shore, the shallows, the foam and the sea itself.
       Last, because the two rules it overrides outright
       (.zone__wake's weight, and the sea artwork's swell) are
       written at the same specificity as the ones they replace. -->
  <link rel="stylesheet" href="css/water.css" />
  <!-- the square's landing, flown by hand: the thrusters and their
       fire, the lock-on, the controller and the hearts. Only adds to
       the round screens; the one rule it needs inside the landing
       chain lives in css/failure.css, where its place is the point. -->
  <link rel="stylesheet" href="css/pilot.css" />
  <!-- Every landing's supplied artwork: ocean, underwater rocks, land. -->
  <link rel="stylesheet" href="css/reef.css" />
  <!-- and the landings as a cut-scene, played over the screen once GO is
       pressed: the letterbox, the shot's layers and its particles -->
  <link rel="stylesheet" href="css/cinematic.css" />
  <!-- and the successful landing and the two crashes, close up: the
       craft and the island, their jets, water and smoke -->
  <link rel="stylesheet" href="css/square-landing.css" />
  <link rel="stylesheet" href="css/square-crash.css" />

  <!-- the one face in the game, and the gate's title is the first
       type on screen -->
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="assets/fonts/baloo_2/baloo2-variablefont_wght.woff2" />

  <!-- No <link rel=preload> for the artwork or the audio: the start
       gate fetches every asset itself (js/preload.js) so the loading
       bar can count real bytes, and a preload here would only fetch
       each file a second time under a different request mode. -->
</head>
<body>

<div class="stage" id="stage">

  <!-- ══════════════════════════ SCREEN 1 — COCKPIT ══════════════════════════ -->
  <section class="screen screen--cockpit is-active" id="screenCockpit">

    <!-- deep space, stretched to fill -->
    <div class="layer layer--bg s1-bg" aria-hidden="true"></div>

    <!-- drifting stars seen through the canopy -->
    <div class="starfield" id="starfield" aria-hidden="true"></div>

    <!-- dust drifting past the glass: the ship is under way (js/cruise.js) -->
    <canvas class="cruise" id="cruiseCanvas" aria-hidden="true"></canvas>

    <!-- the drone flies out through the canopy: sits BELOW the cockpit frame -->
    <div class="flyout" aria-hidden="true">
      <div class="flyout__drone" id="flyDrone">
        <span class="flyout__wash"></span>
        <img src="assets/images/drone.webp" alt="" />
      </div>
      <div class="flyout__trail" id="flyTrail"></div>
    </div>

    <!-- cockpit interior, stretched to fill, painted over the window -->
    <div class="layer layer--cockpit s1-cockpit" aria-hidden="true"></div>

    <!-- ░░ dashboard readout (the yellow box) ░░ -->
    <div class="dash" id="dash">
      <canvas class="dash__wave" id="waveCanvas"></canvas>
      <div class="dash__grid" aria-hidden="true"></div>
      <div class="dash__sheen" aria-hidden="true"></div>
    </div>

    <!-- narration subtitle, read against the canopy -->
    <p class="subtitle" id="cockpitCaption" role="status" aria-live="polite"></p>

    <!-- ░░ LAUNCH button ░░ -->
    <div class="launch-slot" id="launchSlot">
      <button class="launch" id="launchBtn" type="button" aria-label="Launch the survey drone">
        <span class="launch__ring" aria-hidden="true"></span>
        <span class="launch__body">
          <!-- decorative: the cap carries no type of its own, and
               the button's name is on the <button> itself -->
          <img class="launch__plate" src="assets/images/launch-button.webp"
               alt="" draggable="false">
          <span class="launch__flash" aria-hidden="true"></span>
        </span>
      </button>
    </div>

  </section>


  <!-- Screens 2 to 6 -- the five rounds, the square's first with the
       drone's dark-and-scan opening in front of it -- are built here by
       js/pages.js at boot, one screen per shape, in front of screen 7. -->


  <!-- ══════════════════════════ SCREEN 7 — MISSION COMPLETE ══════════════════════════
       After the last round's NEXT: deep space again, the craft the
       mission was about, the title, one line, and RESTART, which
       takes the mission from the top (the cockpit). -->
  <section class="screen screen--end" id="screenEnd">

    <!-- deep space, as the cockpit saw it, without the cockpit -->
    <div class="layer layer--bg s1-bg" aria-hidden="true"></div>
    <div class="starfield" id="endStars" aria-hidden="true"></div>

    <div class="end">
      <img class="end__ship" id="endShip" src="assets/images/welcome-screen-ship.webp"
           alt="" draggable="false">
      <h2 class="end__title" id="endTitle">Mission complete!</h2>
      <p class="end__caption" id="endCaption" role="status" aria-live="polite"></p>
    </div>

    <div class="confetti" id="endConfetti" aria-hidden="true"></div>

    <!-- in the NEXT button's clothes and place: that is where the
         player has been pressing to go on all along -->
    <div class="advance">
      <button class="advance__btn advance__btn--restart" id="restartBtn" type="button" hidden>
        <svg class="advance__arrow" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 12a8 8 0 1 1-2.4-5.7" /><path d="M20 4v5h-5" />
        </svg>
        <span class="advance__label">RESTART</span>
      </button>
    </div>

  </section>

  <!-- ══════════════════════════ SCREEN NAV ══════════════════════════ -->
  <nav class="nav" id="nav" aria-label="Screen navigation">
    <button class="nav__btn" id="navPrev" type="button" aria-label="Previous screen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7" /></svg>
    </button>
    <button class="nav__btn" id="navNext" type="button" aria-label="Next screen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7" /></svg>
    </button>

    <!-- debug: replay the current screen, or jump straight to any screen. The list is filled in by
         buildDebug() in js/script.js once every screen is known. -->
    <button class="nav__btn nav__btn--debug" id="navDebug" type="button"
            aria-label="Debug: jump to a screen" aria-expanded="false" aria-controls="navDebugMenu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14" /></svg>
    </button>
    <div class="debug" id="navDebugMenu" role="menu" hidden></div>
  </nav>


  <!-- ══════════════════════════ START GATE ══════════════════════════ -->
  <div class="gate" id="gate">

    <!-- The mission's title, and the document's heading: it is set
         in type here rather than painted into the backdrop, so it
         scales with the frame and is read out as a heading. -->
    <h1 class="gate__title">
      <span>Spaceship</span>
      <span>Mission</span>
    </h1>

    <!-- The craft under power. The artwork paints its nozzles but no
         exhaust, so the burn is built here: a .gate__thrust hung at
         the main bell, and inside it the cones that make up the
         flame. It comes BEFORE the hull in source order, so the hull
         paints over its mouth. The nacelles' attitude thrusters are
         left cold — the drive at the back is the one that is lit. -->
    <div class="gate__ship" aria-hidden="true">
      <div class="gate__ship-inner">

        <!-- the main bell at the back, firing down and right -->
        <span class="gate__thrust gate__thrust--main">
          <i class="gate__cone gate__cone--outer"></i>
          <i class="gate__cone gate__cone--mid"></i>
          <i class="gate__cone gate__cone--core"></i>
        </span>

        <img class="gate__ship-img" src="assets/images/welcome-screen-ship.webp" alt="" />
      </div>
    </div>

    <div class="gate__inner">

      <!-- The loader and the play cap share one grid cell, so the
           hand-off swaps them in place instead of shifting the
           screen at the moment the mission is ready. -->
      <div class="gate__slot">

        <div class="gate__load" id="gateLoad">
          <div class="gate__bar">
            <span class="gate__fill" id="gateFill"></span>
            <span class="gate__sheen" aria-hidden="true"></span>
            <span class="gate__ticks" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
          </div>
          <!-- the percentage is the whole visible readout; the phase it
               is in stays in the accessibility tree, since that is the
               only thing that tells a screen reader what is happening -->
          <p class="gate__status" role="status" aria-live="polite">
            <span class="gate__stat sr-only" id="gateStatus">Booting mission systems</span>
            <b class="gate__pct" id="gatePct">0%</b>
          </p>
        </div>

        <button class="gate__btn" id="gateBtn" type="button" hidden>
          <!-- filled AND stroked, with round joins: that is what
               takes the three corners off the triangle -->
          <svg class="gate__btn-icon" viewBox="0 0 100 100" aria-hidden="true">
            <path d="M30 24 78 50 30 76Z" stroke-width="13" stroke-linejoin="round" />
          </svg>
          <i class="gate__spark gate__spark--l" aria-hidden="true"><b></b><b></b><b></b></i>
          <i class="gate__spark gate__spark--r" aria-hidden="true"><b></b><b></b><b></b></i>
          <span class="sr-only">Start the mission</span>
        </button>

      </div>

    </div>
  </div>

</div>

<script src="js/lifecycle.js"></script>
<!-- generated from the files on disk by tools/build_manifest.py:
     the byte size of every asset, so the loading bar can weight each
     file by what it really costs before a single Content-Length has
     come back. Regenerate it whenever an asset changes. -->
<script src="js/manifest.js"></script>
<!-- the loading bar's fetcher: streams every asset with a byte
     count, smallest first, five at a time, and hands each one back
     as a blob: URL. Before audio.js, which adopts those URLs. -->
<script src="js/preload.js"></script>
<script src="js/audio.js"></script>
<script src="js/waveform.js"></script>
<script src="js/cruise.js"></script>
<script src="js/typewriter.js"></script>
<script src="js/animation.js"></script>
<!-- the landing and its two failures. After animation.js (it uses
     the same GeoLife-backed wait) and before script.js, which calls
     GeoFail from every one of screens 3 to 8. -->
<script src="js/failure.js"></script>
<!-- screens 2-6: the shape data and the markup built from it. Before
     script.js, which asks it for the rounds while it is booting. -->
<script src="js/pages.js"></script>
<!-- the water. After pages.js, whose measured silhouettes every
     shoreline is built from, and before script.js, which calls
     GeoWater.init() from boot() once the round screens exist. -->
<script src="js/water.js"></script>
<!-- Measured sprite metadata, then every landing's environment. -->
<script src="js/environment-assets.js"></script>
<script src="js/reef.js"></script>
<!-- and its sea drawn through moving water: refraction and caustics -->
<script src="js/reef-water.js"></script>
<!-- the helm: flying the square's craft by hand. Before script.js,
     which hands it the landing screen's site at boot. -->
<script src="js/pilot.js"></script>
<!-- the square's landing as a cut-scene from its sprite sheets (cut by
     tools/build_cinematic.py): the fallback on that screen when the live
     shots below cannot play. Before script.js, which builds it at boot
     and plays it from GO. Its effects are tweened by anime.js (vendored,
     v3.2.2, MIT) and its sounds synthesised by js/cinematic-sfx.js. -->
<script src="js/vendor/anime.min.js"></script>
<script src="js/cinematic-assets.js"></script>
<script src="js/cinematic-sfx.js"></script>
<script src="js/cinematic.js"></script>
<!-- every landing's successful landing and its slide into the sea, played
     from just the shape's two pictures (cut and measured by
     tools/build_landings.py); the cut-scenes -->
<script src="js/landing-assets.js"></script>
<script src="js/square-landing.js"></script>
<!-- the crash on the island too big for it, from the same two
     pictures; a third kind of shot for that player -->
<script src="js/square-crash.js"></script>
<!-- the overhead lens down onto the island before the shot, and back
     up to where it was once the shot has finished -->
<script src="js/close-up.js"></script>
<script src="js/script.js"></script>
</body>
</html>
